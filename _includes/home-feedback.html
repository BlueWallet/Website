<div class="uk-section section-home-feedback">
  <div class="uk-container">
    <div class="section-home-header">
      <h2 class="uk-h1 uk-margin-remove-top">What people are saying</h2>
      <p class="uk-text-lead uk-margin-small-top">From the Bitcoin community, around the world.</p>
    </div>

    <div class="feedback-slider-outer">
      <div class="feedback-track" id="feedback-track">
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-jack.png" alt="Feedback from Jack" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-elon.png" alt="Feedback from Elon" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-africa.png" alt="Feedback from Africa" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-stephan.png" alt="Feedback from Stephan" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-mrhodl.png" alt="Feedback from Mr Hodl" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-bitcoinheiros.png" alt="Feedback from Bitcoinheiros" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-okin.png" alt="Feedback from Okin" loading="lazy">
        </div>
        <div class="feedback-slide">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-wicked.png" alt="Feedback from Wicked" loading="lazy">
        </div>
        <!-- Duplicated for seamless loop -->
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-jack.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-elon.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-africa.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-stephan.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-mrhodl.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-bitcoinheiros.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-okin.png" alt="" loading="lazy">
        </div>
        <div class="feedback-slide" aria-hidden="true">
          <img src="{{ site.uploads | absolute_url }}feedback/feedback-wicked.png" alt="" loading="lazy">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var track = document.getElementById('feedback-track');
  if (!track) return;

  var SPEED = 0.5;       /* px per frame */
  var currentX = 0;
  var halfWidth = 0;
  var isDragging = false;
  var lastPointerX = 0;

  function loop() {
    if (!isDragging) {
      currentX -= SPEED;
      if (halfWidth > 0 && currentX <= -halfWidth) {
        currentX += halfWidth;
      }
    }
    track.style.transform = 'translateX(' + currentX + 'px)';
    requestAnimationFrame(loop);
  }

  function init() {
    halfWidth = track.scrollWidth / 2;
    requestAnimationFrame(loop);
  }

  /* Start after layout is ready */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* Mouse drag */
  track.addEventListener('mousedown', function (e) {
    isDragging = true;
    lastPointerX = e.clientX;
    track.classList.add('is-dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    currentX += e.clientX - lastPointerX;
    lastPointerX = e.clientX;
  });
  window.addEventListener('mouseup', function () {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('is-dragging');
  });

  /* Touch drag */
  track.addEventListener('touchstart', function (e) {
    isDragging = true;
    lastPointerX = e.touches[0].clientX;
  }, { passive: true });
  track.addEventListener('touchmove', function (e) {
    if (!isDragging) return;
    currentX += e.touches[0].clientX - lastPointerX;
    lastPointerX = e.touches[0].clientX;
  }, { passive: true });
  track.addEventListener('touchend', function () {
    isDragging = false;
  }, { passive: true });
})();
</script>
