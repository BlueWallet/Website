<div class="uk-section section-home-feedback">
  <div class="uk-container">
    <div class="section-home-header">
      <h2 class="uk-h1 uk-margin-remove-top">What people are saying</h2>
      <p class="uk-text-lead uk-margin-small-top">From the Bitcoin community, around the world.</p>
    </div>

    <div class="feedback-slider-outer">
      <div class="feedback-slider" id="feedback-slider">
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-jack.png" alt="Feedback from Jack" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-elon.png" alt="Feedback from Elon" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-africa.png" alt="Feedback from Africa" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-stephan.png" alt="Feedback from Stephan" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-mrhodl.png" alt="Feedback from Mr Hodl" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-bitcoinheiros.png" alt="Feedback from Bitcoinheiros" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-okin.png" alt="Feedback from Okin" loading="lazy">
      </div>
      <div class="feedback-slide">
        <img src="{{ site.uploads | absolute_url }}feedback/feedback-wicked.png" alt="Feedback from Wicked" loading="lazy">
      </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var slider = document.getElementById('feedback-slider');
  if (!slider) return;

  var SPEED    = 0.4;  /* px per frame */
  var PAUSE_MS = 2000; /* pause on user interaction */
  var raf, pauseTimer, isDragging = false, startX = 0, startScroll = 0;

  function step() {
    if (isDragging) return;
    /* Seamless loop: when we've scrolled past the halfway point, jump back */
    var maxScroll = slider.scrollWidth / 2;
    if (slider.scrollLeft >= maxScroll) {
      slider.scrollLeft -= maxScroll;
    }
    slider.scrollLeft += SPEED;
    raf = requestAnimationFrame(step);
  }

  function pause() {
    cancelAnimationFrame(raf);
    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(function () { raf = requestAnimationFrame(step); }, PAUSE_MS);
  }

  /* Duplicate slides for seamless loop */
  var slides = Array.from(slider.children);
  slides.forEach(function (slide) {
    slider.appendChild(slide.cloneNode(true));
  });

  /* Drag support */
  slider.addEventListener('mousedown', function (e) {
    isDragging = true;
    startX = e.pageX - slider.offsetLeft;
    startScroll = slider.scrollLeft;
    slider.style.cursor = 'grabbing';
    cancelAnimationFrame(raf);
  });
  slider.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    var x = e.pageX - slider.offsetLeft;
    slider.scrollLeft = startScroll - (x - startX);
  });
  ['mouseup', 'mouseleave'].forEach(function (evt) {
    slider.addEventListener(evt, function () {
      if (!isDragging) return;
      isDragging = false;
      slider.style.cursor = '';
      pause();
    });
  });

  /* Touch support (native scroll handles drag) */
  slider.addEventListener('touchstart', function () { cancelAnimationFrame(raf); }, { passive: true });
  slider.addEventListener('touchend', pause, { passive: true });

  /* Start */
  raf = requestAnimationFrame(step);
})();
</script>
