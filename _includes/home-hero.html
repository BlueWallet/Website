<div class="uk-section section-hero section-hero--home uk-position-relative">
  <div class="hero-bg" aria-hidden="true">
    <picture class="hero-bg__picture">
      <source media="(min-width: 768px)" srcset="{{ site.uploads | absolute_url }}hero-background.png">
      <img class="hero-bg__img" alt="" decoding="async">
    </picture>
  </div>
  <div class="hero-bg-gradient hero-bg-gradient--start" aria-hidden="true"></div>
  <div class="hero-bg-gradient hero-bg-gradient--end" aria-hidden="true"></div>
  <div class="uk-container uk-position-relative uk-scrollspy-inview uk-animation-slide-bottom-medium">
    <div class="uk-grid-match" uk-grid>
      <div class="uk-width-3-5@m">
        <div class="uk-margin-auto-vertical">
          <h1 class="uk-heading-hero uk-text-left@m uk-text-center">Radically<br>Simple & Powerful<br>Bitcoin Wallet</h1>
          <div class="hero-badges uk-flex-left@m uk-flex-center">
            <a href="https://itunes.apple.com/app/bluewallet-bitcoin-wallet/id1376878040" target="_blank" data-pirsch-event="Download" data-pirsch-meta-platform="iOS" data-pirsch-meta-location="Hero">
              <img class="bounce" src="{{ site.uploads | absolute_url }}/app-store-badge-blue.svg" alt="download bitcoin wallet for ios">
            </a>
            <a href="https://play.google.com/store/apps/details?id=io.bluewallet.bluewallet" target="_blank" data-pirsch-event="Download" data-pirsch-meta-platform="Android" data-pirsch-meta-location="Hero">
              <img class="bounce" src="{{ site.uploads | absolute_url }}/play-store-badge-blue.svg" alt="download bitcoin wallet for android">
            </a>
          </div>
          <p class="hero-subtitle uk-text-left@m uk-text-center">Direct download available for <a href="https://github.com/BlueWallet/BlueWallet/releases" target="_blank" data-pirsch-event="Download" data-pirsch-meta-platform="Android APK" data-pirsch-meta-location="Hero">android</a> and <a href="{{ site.baseurl }}/desktop-bitcoin-wallet">Desktop</a></p>
        </div>
      </div>
      <div class="uk-width-2-5@m">
        <div class="hero-preview-stack">
          <img src="{{ site.uploads | absolute_url }}/bluewallet-preview.png" alt="BlueWallet app preview" class="hero-preview-img">
        </div>
      </div>
    </div>
  </div>
</div>
